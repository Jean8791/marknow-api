quarkus.datasource.db-kind=postgresql

# DEV
%dev.quarkus.datasource.username=marknow
%dev.quarkus.datasource.password=marknow
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/marknow

# TESTE
%test.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5433/marknow
%test.quarkus.datasource.username=marknow
%test.quarkus.datasource.password=marknow

# PORTA TETESTE
quarkus.http.test-port=0
quarkus.http.port=9696
#
# Flyway (global)
quarkus.flyway.locations=db/migration
quarkus.flyway.validate-on-migrate=true

# Flyway (DEV ONLY) - isso APAGA o schema ao subir em DEV
%dev.quarkus.flyway.migrate-at-start=true
%dev.quarkus.flyway.clean-at-start=true
%dev.quarkus.flyway.baseline-on-migrate=true

# Flyway TESTE
%test.quarkus.flyway.migrate-at-start=true
%test.quarkus.flyway.clean-at-start=true
%test.quarkus.flyway.locations=db/migration

# (opcional, mas recomendado) em outros profiles não roda automaticamente
%prod.quarkus.flyway.migrate-at-start=false

# Habilita o scheduler
quarkus.scheduler.enabled=true

# JWT vereificar token emitido por marknow
# assina tokens no backend
smallrye.jwt.sign.key.location=jwt/privateKey.pem

# valida tokens recebidos
mp.jwt.verify.publickey.location=jwt/publicKey.pem

# issuer precisa bater com o que você põe no Jwt.issuer("marknow")
mp.jwt.verify.issuer=marknow