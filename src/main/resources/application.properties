quarkus.jackson.write-dates-as-timestamps=false
quarkus.http.port=${PORT:9696}
quarkus.http.test-port=0
%dev.quarkus.http.host=0.0.0.0
#
### Banco
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USERNAME:marknow}
quarkus.datasource.password=${DB_PASSWORD:marknow}
quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:marknow}?sslmode=${DB_SSLMODE:disable}
%test.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5433/marknow
%test.quarkus.datasource.username=marknow
%test.quarkus.datasource.password=marknow
#
### Flyway
quarkus.flyway.locations=db/migration
quarkus.flyway.migrate-at-start=true
quarkus.flyway.validate-on-migrate=true
quarkus.flyway.baseline-on-migrate=true
%dev.quarkus.flyway.repair-at-start=true
%test.quarkus.flyway.clean-at-start=true
#
### Scheduler
quarkus.scheduler.enabled=true
#
### JWT: em produção, aponte para arquivos fora do classpath (ex.: secret files do Render)
smallrye.jwt.sign.key.location=${MARKNOW_JWT_PRIVATE_KEY_LOCATION:jwt/privateKey.pem}
mp.jwt.verify.publickey.location=${MARKNOW_JWT_PUBLIC_KEY_LOCATION:jwt/publicKey.pem}
mp.jwt.verify.issuer=marknow
#
### CORS
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${CORS_ORIGINS:http://localhost:3000}
quarkus.http.cors.methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
quarkus.http.cors.headers=Content-Type,Authorization,Accept,X-Requested-With
quarkus.http.cors.exposed-headers=X-Correlation-Id,Retry-After
#
### Autenticação
marknow.super-admin.senha=${MARKNOW_SUPER_ADMIN_SENHA:}
marknow.auth.cabecalho-ip=${MARKNOW_AUTH_CABECALHO_IP:}
marknow.auth.limite-tentativas=${MARKNOW_AUTH_LIMITE_TENTATIVAS:10}
marknow.auth.janela-minutos=${MARKNOW_AUTH_JANELA_MINUTOS:15}
#
### OpenAPI / Swagger
quarkus.swagger-ui.always-include=true
quarkus.smallrye-openapi.info-title=MarkNow API
quarkus.smallrye-openapi.info-description=API do MarkNow, SaaS de agenda multi-tenant (projeto de portfólio).
quarkus.smallrye-openapi.security-scheme=jwt
